# Builders tracked for Dallas–Fort Worth.
#
# Fields
#   name           Display name used in the sheet.
#   slug           Short id (used in home ids). Never change once data exists.
#   site           Builder homepage. Used for robots.txt and sitemap discovery.
#   seeds          Quick move-in listing pages for DFW. Fetched every run. Homes embedded
#                  in these pages are recorded directly, and links to home pages are queued.
#   promos         Pages where the builder publishes offers/incentives. Fetched every run.
#   detail_pattern Regex a URL must match to count as a single-home (QMI) page.
#                  Default (when omitted) matches address-like slugs: /1234-some-street/
#   hub_pattern    Regex for community/city pages that list homes. Found on seed pages and in the
#                  sitemap, then read in rotation (stalest first) each run.
#   sitemaps       Explicit sitemap URLs (when robots.txt doesn't list a usable one).
#   sitemap        true = also discover home pages from the site's sitemap (every 6 hours).
#   sitemap_filter Regex a sitemap URL must match (use it to keep national builders to DFW).
#   dfw_only       true = everything this builder publishes is DFW (local builders);
#                  false = keep only homes whose city/zip is in DFW.
#   url_parts      Where community / plan sit in a home's URL path, counting back from the home
#                  (-1 = the home itself). Fills community/plan when the page doesn't state them.
#   verified       true = seed URLs were checked by hand on 2026-10-18. false = best guess;
#                  check the "Run Log" tab after the first run and fix if a builder shows 0 homes.

defaults:
  detail_pattern: '/\d{2,6}-[a-z0-9-]+/?$'
  sitemap: true
  dfw_only: false

builders:
  - name: Bloomfield Homes
    slug: bloomfield
    url_parts: {community: -3, plan: -2}
    site: https://www.bloomfieldhomes.com/
    seeds: [https://www.bloomfieldhomes.com/new-homes/available/]
    promos: [https://www.bloomfieldhomes.com/]
    dfw_only: true
    verified: true

  - name: D.R. Horton
    slug: dr-horton
    url_parts: {community: -3}
    site: https://www.drhorton.com/
    seeds:
      - https://www.drhorton.com/texas/dallas
      - https://www.drhorton.com/texas/fort-worth
    promos: [https://www.drhorton.com/texas/dallas, https://www.drhorton.com/texas/fort-worth]
    detail_pattern: '/texas/(dallas|fort-worth)/[^/]+/[^/]+/.+'
    hub_pattern: '^/texas/(dallas|fort-worth)/[^/]+/[^/]+/?$'
    sitemap_filter: '/texas/(dallas|fort-worth)/'
    sitemaps: [https://www.drhorton.com/sitemaps/website.xml]
    verified: false

  - name: First Texas Homes
    slug: first-texas
    site: https://www.firsttexashomes.com/
    seeds:
      - https://www.firsttexashomes.com/include/ajax/qmi.php   # the JSON the QMI page loads its cards from
      - https://www.firsttexashomes.com/quick-move-in-homes/
    promos: [https://www.firsttexashomes.com/promos/index.php]
    detail_pattern: '(/\d{2,6}-[a-z0-9-]+/?$)|(/quick-move-in-homes?/(?!city/)[^?#]*\d[^?#]*$)'
    hub_pattern: '^/quick-move-in-homes/city/[a-z-]+/?$'
    dfw_only: true
    verified: true

  - name: Riverside Homebuilders
    slug: riverside
    site: https://www.riversidehomebuilders.com/
    seeds: [https://www.riversidehomebuilders.com/quick-move-in/]
    promos:
      - https://www.riversidehomebuilders.com/current-incentives/
      - https://www.riversidehomebuilders.com/quick-move-in-specials/
    dfw_only: true
    verified: true

  - name: Trophy Signature Homes
    slug: trophy-signature
    url_parts: {community: -2}
    site: https://trophysignaturehomes.com/
    seeds: [https://trophysignaturehomes.com/communities/dallas-ft-worth]
    promos: [https://trophysignaturehomes.com/promotions]
    sitemap_filter: '(dallas|fort-worth|ft-worth|/tx/)'
    verified: false

  - name: Highland Homes
    slug: highland
    url_parts: {community: -2}
    site: https://www.highlandhomes.com/
    seeds: [https://www.highlandhomes.com/dfw/homes-for-sale]
    promos: [https://www.highlandhomes.com/dfw/promotions]
    detail_pattern: '/dfw/[^/]+/[^/]+/\d{2,4}-\d{2,4}[a-z]?(-[a-z0-9]+)?/?$'   # lot pages; '8009-DAVE-A' style = plans
    sitemap_filter: '/dfw/'
    verified: false

  - name: Graham Hart Home Builder
    slug: graham-hart
    url_parts: {community: -2}
    site: https://www.grahamhart.com/
    seeds: [https://www.grahamhart.com/available-homes/]   # /quick-move-in-homes/ is gone (404)
    promos: [https://www.grahamhart.com/]
    dfw_only: true
    verified: false

  - name: Pyvot Homes
    slug: pyvot
    site: https://www.pyvothomes.com/
    seeds: [https://pyvothomes.com/available-homes/]
    promos: [https://www.pyvothomes.com/]
    dfw_only: true
    verified: false

  # "Century Homes" in DFW is assumed to be Century Communities (and Century Complete).
  - name: Century Communities
    slug: century
    url_parts: {community: -3}
    site: https://www.centurycommunities.com/
    seeds: [https://www.centurycommunities.com/find-your-home/texas/dallas-fort-worth-metro]
    promos: [https://www.centurycommunities.com/find-your-home/texas/dallas-fort-worth-metro]
    detail_pattern: '/lots/[^/]+/?$'
    sitemap_filter: 'dallas-fort-worth'
    verified: true

  - name: HistoryMaker Homes
    slug: historymaker
    url_parts: {community: -2}
    site: https://www.historymaker.com/
    seeds: [https://www.historymaker.com/new-home-communities/quick-move-ins/dallas-fort-worth]   # old /quick-move-in-homes/ is 404
    promos: [https://www.historymaker.com/promotions/]
    verified: false

  - name: K. Hovnanian Homes
    slug: khov
    url_parts: {community: -2}
    site: https://www.khov.com/
    seeds: [https://www.khov.com/find-new-homes/texas/dallas-fort-worth]
    promos: [https://www.khov.com/find-new-homes/texas/dallas-fort-worth]
    sitemap_filter: '/texas/'
    verified: false

  - name: Pacesetter Homes Texas
    slug: pacesetter
    url_parts: {community: -3}
    site: https://pacesetterhomestexas.com/
    seeds: [https://pacesetterhomestexas.com/]   # /new-homes-for-sale-dallas/ is 404; homes come from the sitemap
    promos: [https://pacesetterhomestexas.com/]
    detail_pattern: '/quick-move-in-home/[^/]+/?$'
    sitemap_filter: 'new-homes-for-sale-dallas'
    dfw_only: false              # also builds in Austin (/new-homes-for-sale-austin/)
    verified: true

  - name: Beazer Homes
    slug: beazer
    url_parts: {community: -3, plan: -2}
    site: https://www.beazer.com/
    # community pages carry their quick move-in homes in the Next.js data stream; home = /<plan>/<homesite no.>
    detail_pattern: '/dallas-tx/[^/]+/[^/]+/[^/]+/\d{3,5}/?$'
    seeds: [https://www.beazer.com/dallas-tx]
    promos: [https://www.beazer.com/dallas-tx]
    hub_pattern: '^/dallas-tx/[a-z-]+(/[a-z0-9-]+)?/?$'
    sitemap_filter: '/dallas-tx/'
    verified: false

  - name: Coventry Homes
    slug: coventry
    url_parts: {community: -3, plan: -2}
    site: https://www.coventryhomes.com/
    seeds: [https://www.coventryhomes.com/new-homes/tx/dallas-ft-worth/available-homes/]
    promos: [https://www.coventryhomes.com/new-homes/tx/dallas-ft-worth/available-homes/]
    # Coventry builds across Texas; its URLs carry the town (/new-homes/tx/<town>/...), so only DFW towns.
    sitemap_filter: 'dallas-ft-worth|/new-homes/tx/(aledo|allen|alvarado|anna|argyle|arlington|aubrey|azle|balch-springs|bedford|benbrook|burleson|caddo-mills|carrollton|cedar-hill|celina|cleburne|colleyville|commerce|coppell|corinth|crandall|crowley|dallas|decatur|denison|denton|desoto|duncanville|ennis|euless|farmers-branch|farmersville|fate|ferris|flower-mound|forney|fort-worth|frisco|gainesville|garland|glenn-heights|godley|granbury|grand-prairie|grapevine|greenville|gunter|haltom-city|haslet|heartland|heath|howe|hurst|irving|josephine|joshua|justin|kaufman|keller|kennedale|krum|lancaster|lantana|lavon|lewisville|little-elm|lucas|mansfield|mckinney|mclendon-chisholm|melissa|mesquite|midlothian|murphy|nevada|new-fairview|north-richland-hills|northlake|oak-point|ovilla|parker|pilot-point|plano|ponder|poolville|princeton|prosper|providence-village|red-oak|rhome|richardson|roanoke|rockwall|rowlett|royse-city|sachse|saginaw|sanger|seagoville|sherman|southlake|springtown|sunnyvale|terrell|tioga|trenton|van-alstyne|venus|watauga|waxahachie|weatherford|westlake|wylie)/'
    verified: true

  - name: DRB Homes
    slug: drb
    site: https://www.drbhomes.com/
    seeds: [https://www.drbhomes.com/drbhomes/find-your-home/texas/dallas-fort-worth]
    promos: [https://www.drbhomes.com/drbhomes/promotions]
    sitemap_filter: '(texas|dallas|fort-worth)'
    verified: false

  - name: Meritage Homes
    slug: meritage
    site: https://www.meritagehomes.com/
    seeds: []
    promos: [https://www.meritagehomes.com/promotions]
    sitemap_filter: '/tx/(dallas|fort-worth|dallas-fort-worth)'
    verified: false

  - name: Perry Homes
    slug: perry
    url_parts: {community: -2}
    site: https://www.perryhomes.com/
    seeds: []
    promos: []
    sitemap_filter: '/new-homes/texas/dallas/'
    verified: false

  - name: KB Home
    slug: kb
    site: https://www.kbhome.com/
    seeds: [https://www.kbhome.com/new-homes-dallas-fort-worth]
    promos: [https://www.kbhome.com/new-homes-dallas-fort-worth]
    hub_pattern: '^/new-homes-dallas-fort-worth/[a-z0-9-]+/?$'
    sitemap_filter: 'dallas-fort-worth'
    verified: false

  - name: David Weekley Homes
    slug: david-weekley
    url_parts: {community: -2}
    site: https://www.davidweekleyhomes.com/
    seeds: [https://www.davidweekleyhomes.com/new-homes/tx/dallas-ft-worth]
    promos: [https://www.davidweekleyhomes.com/new-homes/tx/dallas-ft-worth]
    detail_pattern: '/homes-ready-soon/tx/dallas-ft-worth/[^/]+/[^/]+/\d{5,}/?$'
    sitemap_filter: '/tx/dallas-ft-worth/'
    verified: false

  - name: M/I Homes
    slug: mi-homes
    url_parts: {community: -3, plan: -2}
    site: https://www.mihomes.com/
    seeds: [https://www.mihomes.com/new-homes/texas/dallas-fort-worth-area]
    promos: [https://www.mihomes.com/new-homes/texas/dallas-fort-worth-area]
    sitemap_filter: 'dallas'
    verified: false

  - name: Shaddock Homes
    slug: shaddock
    url_parts: {community: -2}
    site: https://www.shaddockhomes.com/
    seeds: [https://www.shaddockhomes.com/quick-move-in-homes/]
    promos: [https://www.shaddockhomes.com/]
    sitemap_filter: '/dallas-fort-worth/'
    dfw_only: false              # also builds in Austin (/homes/austin/)
    verified: false
