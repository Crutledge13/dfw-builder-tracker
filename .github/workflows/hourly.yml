name: Hourly builder price tracking

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 UTC (off the top of the hour, GitHub's busiest minute)
  workflow_dispatch:
    inputs:
      only:
        description: "Builder slugs to run (space-separated, blank = all)"
        required: false
        default: ""
      budget:
        description: "Max pages per builder this run"
        required: false
        default: "120"

permissions:
  contents: write              # to commit the updated data files

concurrency:
  group: builder-tracker       # never let two runs write the data at once
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Load latest saved data
        run: git pull --ff-only origin main   # a queued run must start from the previous run's data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          # Optional: set both secrets to also write a Google Sheet. Otherwise data goes to docs/data/.
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
          PAGES_PER_BUILDER: ${{ github.event.inputs.budget || '120' }}
          ONLY_BUILDERS: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY_BUILDERS" ]; then
            # shellcheck disable=SC2086
            python -m tracker.run --only $(echo "$ONLY_BUILDERS" | tr -cd 'a-z0-9- ')
          else
            python -m tracker.run
          fi

      - name: Save data
        run: |
          git config user.name  "builder-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          for f in tracker/zip_centroids.csv tracker/place_centroids.csv; do [ -f "$f" ] && git add "$f"; done; true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')"
          # this run's data is the newest; if a code or manual push touched the same data files meanwhile, keep ours
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
