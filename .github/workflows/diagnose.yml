name: Diagnose builder pages

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Builder slugs (space-separated, blank = all)"
        required: false
        default: ""
      urls:
        description: "Specific page URLs to save instead (space-separated)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Save sample pages
        env:
          ONLY_BUILDERS: ${{ github.event.inputs.only }}
          DIAG_URLS: ${{ github.event.inputs.urls }}
        run: |
          # shellcheck disable=SC2086
          python -m tracker.diagnose $(echo "$ONLY_BUILDERS" | tr -cd 'a-z0-9- ')
      - name: Push to diagnostics branch
        run: |
          git config user.name  "builder-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diagnostics
          git rm -rfq --cached .
          git add diag
          git commit -qm "Diagnostic pages $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -fq origin diagnostics
